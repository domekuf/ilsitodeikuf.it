# Deploy manuale su Cloudflare Workers (§3, CI/CD).
# Da spostare in .github/workflows/deploy.yml. Parte SOLO a mano (Actions → Deploy → Run workflow),
# mai da solo su push: si cambia in `on: push` quando la band dà l'ok.
#
# Serve, in Settings → Secrets and variables → Actions:
#   - secret   CLOUDFLARE_API_TOKEN       (token con il template "Edit Cloudflare Workers" + D1 edit)
#   - secret   CLOUDFLARE_ACCOUNT_ID
#   - variable PUBLIC_TURNSTILE_SITE_KEY  (la chiave pubblica vera del widget)
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run check && npm test
      - name: Migrazioni D1 (remote)
        run: npx wrangler d1 migrations apply kuf-sito --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build e deploy
        run: npm run deploy
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
